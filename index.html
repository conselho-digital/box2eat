<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roteiro Animado</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#1D4ED8;--primary2:#3b82f6;
  --success:#10B981;--ai:#7C3AED;--warning:#F59E0B;--danger:#EF4444;
  --bg:#F8FAFC;--card:#FFFFFF;
  --border:#E2E8F0;--border2:#CBD5E1;
  --text:#0F172A;--text2:#64748B;--text3:#94A3B8;
  --r:10px;--r2:14px;--r3:20px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --shadow2:0 4px 6px -1px rgba(0,0,0,.07),0 2px 4px -1px rgba(0,0,0,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh}
h1{font-size:20px;font-weight:700}
h2{font-size:15px;font-weight:600}
button{font-family:inherit;cursor:pointer;border:none}
input,select,textarea{font-family:inherit;font-size:16px}

.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:24px;position:sticky;top:0;z-index:10}
.topbar h1{color:var(--primary);font-size:17px;white-space:nowrap}
.tabs{display:flex;gap:4px;margin-left:auto}
.tab{padding:9px 16px;border-radius:999px;background:transparent;color:var(--text2);font-weight:500;font-size:13px;transition:.15s;touch-action:manipulation}
.tab:hover{background:var(--bg)}
.tab.active{background:var(--primary);color:#fff}

.wrap{max-width:1100px;margin:0 auto;padding:16px}

@media (max-width:640px){
  .topbar{flex-wrap:wrap;justify-content:center;gap:10px;padding:10px 12px}
  .topbar h1{font-size:15px}
  .tabs{margin-left:0;width:100%;justify-content:center}
  .tab{flex:1;text-align:center;padding:10px 6px}
  .wrap{padding:12px}
}
.view{display:none}
.view.active{display:block}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:20px;box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:280px 1fr;gap:20px}
.grid-avatars{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px;margin-top:14px}

label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin:12px 0 4px}
label:first-child{margin-top:0}
select,input[type=text],textarea{width:100%;padding:9px 10px;border:1px solid var(--border2);border-radius:var(--r);background:#fff;color:var(--text);min-height:42px}
textarea{resize:vertical;min-height:60px}
input[type=color]{width:48px;height:38px;border:1px solid var(--border2);border-radius:8px;padding:2px;background:#fff}
.row-inline{display:flex;gap:10px;align-items:center}
.row-inline > *{flex:1}

.btn{padding:10px 16px;border-radius:var(--r);font-weight:600;font-size:13px;transition:.15s;display:inline-flex;align-items:center;gap:6px;touch-action:manipulation;min-height:40px}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:#1a43b8}
.btn-ghost{background:var(--bg);color:var(--text);border:1px solid var(--border2) !important}
.btn-ghost:hover{background:#eef2f7}
.btn-danger{background:#fee2e2;color:var(--danger)}
.btn-danger:hover{background:#fecaca}
.btn-icon{width:38px;height:38px;padding:0;border-radius:8px;background:var(--bg);color:var(--text2);display:inline-flex;align-items:center;justify-content:center;font-size:16px;touch-action:manipulation;flex-shrink:0}
.btn-icon:hover{background:#eef2f7}
.btn:disabled{opacity:.4;cursor:not-allowed}

.avatar-card{border:1px solid var(--border);border-radius:var(--r2);padding:10px;text-align:center;background:#fff;position:relative;cursor:pointer;transition:.15s}
.avatar-card:hover{border-color:var(--primary2);box-shadow:var(--shadow)}
.avatar-card.selected{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary) inset}
.avatar-card .name{font-size:12px;font-weight:600;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar-card .del{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:6px;background:#fff;border:1px solid var(--border);color:var(--danger);font-size:11px;display:flex;align-items:center;justify-content:center}

.empty{color:var(--text3);font-size:13px;text-align:center;padding:30px 10px}

/* --- Falas / roteiro --- */
.fala-row{display:grid;grid-template-columns:150px 1fr 130px auto;gap:10px;align-items:start;padding:12px;border:1px solid var(--border);border-radius:var(--r);margin-bottom:10px;background:#fff}
.fala-row .actions{display:flex;flex-direction:column;gap:4px}
.fala-num{width:22px;height:22px;border-radius:999px;background:var(--bg);color:var(--text2);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.fala-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}

/* --- Palco --- */
.stage-wrap{background:linear-gradient(180deg,#dbeafe,#eef2ff);border-radius:var(--r3);padding:0;overflow:hidden;position:relative;aspect-ratio:16/9;box-shadow:var(--shadow2)}
.stage{position:absolute;inset:0;transform-origin:50% 50%;transition:transform .6s cubic-bezier(.4,0,.2,1)}
.character-slot{position:absolute;bottom:6%;transform:translateX(-50%);transition:opacity .4s;text-align:center}
.character-slot .cname{font-size:13px;font-weight:700;color:var(--text);background:#ffffffcc;padding:2px 10px;border-radius:999px;margin-top:4px;display:inline-block}
.bubble{position:absolute;top:-14px;left:50%;transform:translate(-50%,-100%);background:#fff;border-radius:14px;padding:8px 14px;max-width:220px;font-size:12px;font-weight:500;box-shadow:var(--shadow2);opacity:0;transition:opacity .25s}
.bubble.show{opacity:1}
.bubble:after{content:"";position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);border-width:6px 6px 0;border-style:solid;border-color:#fff transparent transparent}

.stage-controls{display:flex;align-items:center;gap:8px;margin-top:16px;flex-wrap:wrap}
.stage-controls .btn{flex:1 1 auto;justify-content:center;white-space:nowrap}
.progress{flex-basis:100%;order:10;height:6px;background:var(--border);border-radius:999px;overflow:hidden;margin-top:4px}
.progress-bar{height:100%;background:var(--primary);width:0%;transition:width .3s}
.fala-atual{font-size:12px;color:var(--text2);margin-top:8px}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;z-index:100;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:760px){
  .grid2{grid-template-columns:1fr}
  .fala-row{grid-template-columns:1fr}
  .fala-row .actions{flex-direction:row;justify-content:flex-end}
}

@media (max-width:480px){
  .stage-wrap{aspect-ratio:3/4}
  .character-slot .cname{font-size:11px;padding:2px 8px}
  .bubble{max-width:150px;font-size:11px}
}
</style>
</head>
<body>

<div class="topbar">
  <h1>🎬 Roteiro Animado</h1>
  <div class="tabs">
    <button class="tab" data-view="avatares">Avatares</button>
    <button class="tab" data-view="roteiro">Roteiro</button>
    <button class="tab" data-view="palco">Palco</button>
  </div>
</div>

<div class="wrap">

  <!-- ===================== AVATARES ===================== -->
  <section id="view-avatares" class="view">
    <div class="grid2">
      <div class="card" style="text-align:center">
        <h2 style="margin-bottom:12px">Criar avatar</h2>
        <svg id="preview-svg" viewBox="0 0 200 260" style="width:100%;max-width:200px"></svg>

        <label>Nome</label>
        <input type="text" id="f-nome" placeholder="Ex: Ana">

        <label>Forma da cabeça</label>
        <select id="f-head">
          <option value="circle">Redonda</option>
          <option value="square">Quadrada</option>
          <option value="rounded">Oval</option>
        </select>

        <label>Cor da pele</label>
        <div class="row-inline">
          <input type="color" id="f-skin" value="#f2c9a0">
        </div>

        <label>Olhos</label>
        <select id="f-eyes">
          <option value="dots">Simples</option>
          <option value="round">Redondos</option>
          <option value="happy">Sorridentes</option>
        </select>

        <label>Cabelo</label>
        <select id="f-hair">
          <option value="none">Careca</option>
          <option value="short">Curto</option>
          <option value="long">Longo</option>
          <option value="spiky">Espetado</option>
        </select>

        <label>Cor do cabelo</label>
        <input type="color" id="f-haircolor" value="#3b2a1a">

        <label>Cor da roupa</label>
        <input type="color" id="f-outfit" value="#1D4ED8">

        <div style="margin-top:16px;display:flex;gap:8px">
          <button class="btn btn-primary" id="btn-save-avatar" style="flex:1">💾 Salvar avatar</button>
        </div>
        <div id="edit-hint" style="font-size:11px;color:var(--text3);margin-top:8px;display:none">Editando avatar existente — salvar vai atualizá-lo.</div>
      </div>

      <div class="card">
        <h2>Seus avatares</h2>
        <div id="avatar-list" class="grid-avatars"></div>
      </div>
    </div>
  </section>

  <!-- ===================== ROTEIRO ===================== -->
  <section id="view-roteiro" class="view">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <h2>Roteiro</h2>
        <button class="btn btn-primary" id="btn-add-fala">+ Adicionar fala</button>
      </div>
      <div id="falas-list"></div>
      <div id="falas-empty" class="empty" style="display:none">Nenhuma fala ainda. Crie avatares na aba anterior e adicione a primeira fala.</div>
    </div>
  </section>

  <!-- ===================== PALCO ===================== -->
  <section id="view-palco" class="view">
    <div class="card">
      <h2 style="margin-bottom:14px">Palco</h2>
      <div class="stage-wrap">
        <div class="stage" id="stage"></div>
      </div>
      <div class="stage-controls">
        <button class="btn btn-primary" id="btn-play">▶ Reproduzir</button>
        <button class="btn btn-ghost" id="btn-pause">⏸ Pausar</button>
        <button class="btn btn-ghost" id="btn-prev">⏮ Anterior</button>
        <button class="btn btn-ghost" id="btn-next">⏭ Pular</button>
        <button class="btn btn-ghost" id="btn-restart">↺ Reiniciar</button>
        <div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
      </div>
      <div class="fala-atual" id="fala-atual-label">Pronto para reproduzir.</div>
    </div>
  </section>

</div>

<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

/* ---------------------------------------------------------------- */
/* Estado / persistência                                             */
/* ---------------------------------------------------------------- */
const LS_AVATARS = "roteiro_avatares";
const LS_FALAS = "roteiro_falas";

function loadAvatars(){
  try{ return JSON.parse(localStorage.getItem(LS_AVATARS)) || []; }catch(e){ return []; }
}
function saveAvatars(list){
  localStorage.setItem(LS_AVATARS, JSON.stringify(list));
}
function loadFalas(){
  try{ return JSON.parse(localStorage.getItem(LS_FALAS)) || []; }catch(e){ return []; }
}
function saveFalas(list){
  localStorage.setItem(LS_FALAS, JSON.stringify(list));
}

let avatars = loadAvatars();
let falas = loadFalas();
let editingAvatarId = null;

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove("show"), 1800);
}

/* ---------------------------------------------------------------- */
/* Navegação por abas                                                 */
/* ---------------------------------------------------------------- */
const tabs = document.querySelectorAll(".tab");
const views = document.querySelectorAll(".view");
function showView(name){
  tabs.forEach(t=>t.classList.toggle("active", t.dataset.view===name));
  views.forEach(v=>v.classList.toggle("active", v.id==="view-"+name));
  localStorage.setItem("roteiro_tab", name);
  if(name==="roteiro") renderFalas();
  if(name==="palco") renderStage();
}
tabs.forEach(t=>t.addEventListener("click", ()=>showView(t.dataset.view)));

/* ---------------------------------------------------------------- */
/* Construção do SVG do avatar                                        */
/* Retorna innerHTML de um <svg viewBox="0 0 200 260">                */
/* partes com data-part para permitir animação depois                 */
/* ---------------------------------------------------------------- */
function headPath(shape){
  // caixa da cabeça: 60x60 centrada em (100,90)
  if(shape==="square") return `<rect data-part="head" x="65" y="55" width="70" height="70" rx="8"/>`;
  if(shape==="rounded") return `<ellipse data-part="head" cx="100" cy="90" rx="38" ry="46"/>`;
  return `<circle data-part="head" cx="100" cy="90" r="40"/>`; // circle
}
function eyesSvg(style){
  if(style==="round") return `
    <circle cx="85" cy="85" r="6" fill="#fff"/><circle cx="85" cy="85" r="3" fill="#1e293b"/>
    <circle cx="115" cy="85" r="6" fill="#fff"/><circle cx="115" cy="85" r="3" fill="#1e293b"/>`;
  if(style==="happy") return `
    <path d="M78 85 Q85 78 92 85" stroke="#1e293b" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M108 85 Q115 78 122 85" stroke="#1e293b" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  return `<circle cx="85" cy="86" r="3.5" fill="#1e293b"/><circle cx="115" cy="86" r="3.5" fill="#1e293b"/>`; // dots
}
function hairSvg(style, color){
  if(style==="none") return "";
  if(style==="short") return `<path d="M60 70 Q100 30 140 70 L140 55 Q100 40 60 55 Z" fill="${color}"/>`;
  if(style==="long") return `<path d="M58 70 Q100 25 142 70 L146 130 L128 130 L128 75 Q100 55 72 75 L72 130 L54 130 Z" fill="${color}"/>`;
  if(style==="spiky") return `<path d="M62 68 L70 40 L80 62 L92 32 L100 60 L108 32 L120 62 L130 40 L138 68 Q100 45 62 68 Z" fill="${color}"/>`;
  return "";
}
function avatarSvgMarkup(cfg){
  return `
    <g data-part="body-group">
      <!-- braco direito (do avatar), pivot no ombro -->
      <g data-part="arm-r-pivot" transform="translate(138,150) rotate(70)">
        <rect data-part="arm-r" x="-6" y="0" width="12" height="55" rx="6" fill="${cfg.skin}"/>
      </g>
      <!-- braco esquerdo -->
      <g data-part="arm-l-pivot" transform="translate(62,150) rotate(-70)">
        <rect data-part="arm-l" x="-6" y="0" width="12" height="55" rx="6" fill="${cfg.skin}"/>
      </g>
      <!-- corpo -->
      <rect x="65" y="140" width="70" height="100" rx="18" fill="${cfg.outfit}"/>
      <!-- cabeca -->
      <g fill="${cfg.skin}">${headPath(cfg.head)}</g>
      ${eyesSvg(cfg.eyes)}
      <!-- boca: retangulo que escala verticalmente para simular fala -->
      <rect data-part="mouth" x="88" y="104" width="24" height="6" rx="3" fill="#7a3b3b"
            style="transform-origin:100px 107px"/>
      ${hairSvg(cfg.hair, cfg.hairColor)}
    </g>`;
}
function renderAvatarInto(svgEl, cfg){
  svgEl.setAttribute("viewBox","0 0 200 260");
  svgEl.innerHTML = avatarSvgMarkup(cfg);
}

/* ---------------------------------------------------------------- */
/* Formulário de criação de avatar                                    */
/* ---------------------------------------------------------------- */
const previewSvg = document.getElementById("preview-svg");
const fNome = document.getElementById("f-nome");
const fHead = document.getElementById("f-head");
const fSkin = document.getElementById("f-skin");
const fEyes = document.getElementById("f-eyes");
const fHair = document.getElementById("f-hair");
const fHairColor = document.getElementById("f-haircolor");
const fOutfit = document.getElementById("f-outfit");
const editHint = document.getElementById("edit-hint");

function currentFormConfig(){
  return {
    head: fHead.value, skin: fSkin.value, eyes: fEyes.value,
    hair: fHair.value, hairColor: fHairColor.value, outfit: fOutfit.value
  };
}
function updatePreview(){ renderAvatarInto(previewSvg, currentFormConfig()); }
[fHead,fSkin,fEyes,fHair,fHairColor,fOutfit].forEach(el=>el.addEventListener("input", updatePreview));

function resetForm(){
  editingAvatarId = null;
  fNome.value = ""; fHead.value="circle"; fSkin.value="#f2c9a0"; fEyes.value="dots";
  fHair.value="short"; fHairColor.value="#3b2a1a"; fOutfit.value="#1D4ED8";
  editHint.style.display = "none";
  updatePreview();
}

document.getElementById("btn-save-avatar").addEventListener("click", ()=>{
  const nome = fNome.value.trim();
  if(!nome){ toast("Dê um nome ao avatar"); return; }
  const cfg = currentFormConfig();
  if(editingAvatarId){
    const a = avatars.find(x=>x.id===editingAvatarId);
    Object.assign(a, cfg, {name:nome});
  } else {
    avatars.push(Object.assign({id:uid(), name:nome}, cfg));
  }
  saveAvatars(avatars);
  renderAvatarList();
  toast("Avatar salvo!");
  resetForm();
});

function renderAvatarList(){
  const wrap = document.getElementById("avatar-list");
  wrap.innerHTML = "";
  if(avatars.length===0){
    wrap.innerHTML = `<div class="empty" style="grid-column:1/-1">Nenhum avatar criado ainda.</div>`;
    return;
  }
  avatars.forEach(a=>{
    const card = document.createElement("div");
    card.className = "avatar-card";
    card.innerHTML = `<button class="del" title="Excluir">✕</button><svg viewBox="0 0 200 260" style="width:100%"></svg><div class="name">${escapeHtml(a.name)}</div>`;
    renderAvatarInto(card.querySelector("svg"), a);
    card.querySelector(".del").addEventListener("click", (e)=>{
      e.stopPropagation();
      if(!confirm(`Excluir o avatar "${a.name}"? Falas que usam esse avatar continuarão, mas sem personagem valido.`)) return;
      avatars = avatars.filter(x=>x.id!==a.id);
      saveAvatars(avatars);
      renderAvatarList();
    });
    card.addEventListener("click", ()=>{
      editingAvatarId = a.id;
      fNome.value = a.name; fHead.value=a.head; fSkin.value=a.skin; fEyes.value=a.eyes;
      fHair.value=a.hair; fHairColor.value=a.hairColor; fOutfit.value=a.outfit;
      editHint.style.display = "block";
      updatePreview();
      window.scrollTo({top:0, behavior:"smooth"});
    });
    wrap.appendChild(card);
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* ---------------------------------------------------------------- */
/* Editor de roteiro                                                  */
/* ---------------------------------------------------------------- */
document.getElementById("btn-add-fala").addEventListener("click", ()=>{
  if(avatars.length===0){ toast("Crie um avatar primeiro"); showView("avatares"); return; }
  falas.push({id:uid(), avatarId:avatars[0].id, texto:"", gesto:"nenhum"});
  saveFalas(falas);
  renderFalas();
});

function renderFalas(){
  const wrap = document.getElementById("falas-list");
  const empty = document.getElementById("falas-empty");
  wrap.innerHTML = "";
  empty.style.display = falas.length===0 ? "block" : "none";

  falas.forEach((f, idx)=>{
    const row = document.createElement("div");
    row.className = "fala-row";

    const avatarOptions = avatars.map(a=>`<option value="${a.id}" ${a.id===f.avatarId?"selected":""}>${escapeHtml(a.name)}</option>`).join("");

    row.innerHTML = `
      <div>
        <div class="fala-head"><span class="fala-num">${idx+1}</span><span style="font-size:11px;color:var(--text2);font-weight:600">Personagem</span></div>
        <select data-field="avatarId">${avatarOptions || '<option value="">(sem avatares)</option>'}</select>
        <label style="margin-top:8px">Gesto</label>
        <select data-field="gesto">
          <option value="nenhum" ${f.gesto==="nenhum"?"selected":""}>Nenhum</option>
          <option value="acenar" ${f.gesto==="acenar"?"selected":""}>Acenar</option>
          <option value="apontar" ${f.gesto==="apontar"?"selected":""}>Apontar</option>
        </select>
      </div>
      <div>
        <label style="margin-top:0">Fala</label>
        <textarea data-field="texto" placeholder="O que esse personagem vai dizer...">${escapeHtml(f.texto)}</textarea>
      </div>
      <div></div>
      <div class="actions">
        <button class="btn-icon" data-act="up" title="Mover para cima">↑</button>
        <button class="btn-icon" data-act="down" title="Mover para baixo">↓</button>
        <button class="btn-icon" data-act="del" title="Remover" style="color:var(--danger)">✕</button>
      </div>
    `;

    row.querySelector('[data-field="avatarId"]').addEventListener("change", e=>{ f.avatarId = e.target.value; saveFalas(falas); });
    row.querySelector('[data-field="gesto"]').addEventListener("change", e=>{ f.gesto = e.target.value; saveFalas(falas); });
    row.querySelector('[data-field="texto"]').addEventListener("input", e=>{ f.texto = e.target.value; saveFalas(falas); });

    row.querySelector('[data-act="up"]').addEventListener("click", ()=>{
      if(idx===0) return;
      [falas[idx-1], falas[idx]] = [falas[idx], falas[idx-1]];
      saveFalas(falas); renderFalas();
    });
    row.querySelector('[data-act="down"]').addEventListener("click", ()=>{
      if(idx===falas.length-1) return;
      [falas[idx+1], falas[idx]] = [falas[idx], falas[idx+1]];
      saveFalas(falas); renderFalas();
    });
    row.querySelector('[data-act="del"]').addEventListener("click", ()=>{
      falas = falas.filter(x=>x.id!==f.id);
      saveFalas(falas); renderFalas();
    });

    wrap.appendChild(row);
  });
}

/* ---------------------------------------------------------------- */
/* Palco / Reprodução                                                 */
/* ---------------------------------------------------------------- */
const stageEl = document.getElementById("stage");
const progressBar = document.getElementById("progress-bar");
const falaAtualLabel = document.getElementById("fala-atual-label");

let playIndex = 0;
let isPlaying = false;
let mouthTimer = null;
let currentUtterance = null;

function participantsForStage(){
  // avatares distintos usados no roteiro, na ordem em que aparecem primeiro
  const ids = [];
  falas.forEach(f=>{ if(f.avatarId && !ids.includes(f.avatarId)) ids.push(f.avatarId); });
  return ids.map(id=>avatars.find(a=>a.id===id)).filter(Boolean);
}

function renderStage(){
  stageEl.innerHTML = "";
  stageEl.style.transform = "scale(1)";
  const cast = participantsForStage();
  if(cast.length===0){
    stageEl.innerHTML = `<div class="empty" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">Adicione falas com personagens para ver o palco.</div>`;
    return;
  }
  const n = cast.length;
  const widthPct = Math.min(38, 82/n);
  cast.forEach((a, i)=>{
    const leftPct = ((i+1)/(n+1))*100;
    const slot = document.createElement("div");
    slot.className = "character-slot";
    slot.dataset.avatarId = a.id;
    slot.style.left = leftPct + "%";
    slot.style.width = `min(160px, ${widthPct}%)`;
    slot.innerHTML = `
      <div class="bubble" data-part="bubble"></div>
      <svg viewBox="0 0 200 260" style="width:100%"></svg>
      <div class="cname">${escapeHtml(a.name)}</div>
    `;
    renderAvatarInto(slot.querySelector("svg"), a);
    stageEl.appendChild(slot);
  });
  resetPlaybackUI();
}

function slotFor(avatarId){
  return stageEl.querySelector(`.character-slot[data-avatar-id="${avatarId}"]`);
}

function focusOn(avatarId){
  const cast = participantsForStage();
  const n = cast.length;
  const idx = cast.findIndex(a=>a.id===avatarId);
  cast.forEach(a=>{
    const slot = slotFor(a.id);
    if(!slot) return;
    slot.style.opacity = (avatarId===null || a.id===avatarId) ? "1" : "0.35";
  });
  if(avatarId===null || idx<0){
    stageEl.style.transformOrigin = "50% 60%";
    stageEl.style.transform = "scale(1)";
    return;
  }
  const leftPct = ((idx+1)/(n+1))*100;
  stageEl.style.transformOrigin = leftPct + "% 65%";
  stageEl.style.transform = "scale(1.7)";
}

function setMouth(avatarId, open){
  const slot = slotFor(avatarId);
  if(!slot) return;
  const mouth = slot.querySelector('[data-part="mouth"]');
  if(mouth) mouth.style.transform = open ? "scaleY(2.4)" : "scaleY(1)";
}
function setArm(avatarId, gesto, on){
  const slot = slotFor(avatarId);
  if(!slot) return;
  const rPivot = slot.querySelector('[data-part="arm-r-pivot"]');
  const lPivot = slot.querySelector('[data-part="arm-l-pivot"]');
  if(!rPivot || !lPivot) return;
  rPivot.style.transition = "transform .35s ease";
  lPivot.style.transition = "transform .35s ease";
  if(!on || gesto==="nenhum"){
    rPivot.setAttribute("transform","translate(138,150) rotate(70)");
    lPivot.setAttribute("transform","translate(62,150) rotate(-70)");
    return;
  }
  if(gesto==="apontar"){
    rPivot.setAttribute("transform","translate(138,150) rotate(-10)");
    lPivot.setAttribute("transform","translate(62,150) rotate(-70)");
    return;
  }
  if(gesto==="acenar"){
    rPivot.setAttribute("transform","translate(138,150) rotate(-30)");
    lPivot.setAttribute("transform","translate(62,150) rotate(-70)");
  }
}

let waveTimer = null;
function startGestureLoop(avatarId, gesto){
  stopGestureLoop();
  if(gesto==="acenar"){
    let flip = false;
    waveTimer = setInterval(()=>{
      const slot = slotFor(avatarId);
      if(!slot) return;
      const rPivot = slot.querySelector('[data-part="arm-r-pivot"]');
      if(rPivot) rPivot.setAttribute("transform", `translate(138,150) rotate(${flip?-45:-15})`);
      flip = !flip;
    }, 260);
  }
  setArm(avatarId, gesto, true);
}
function stopGestureLoop(){
  if(waveTimer){ clearInterval(waveTimer); waveTimer = null; }
}

function showBubble(avatarId, text){
  stageEl.querySelectorAll('[data-part="bubble"]').forEach(b=>{ b.classList.remove("show"); b.textContent=""; });
  const slot = slotFor(avatarId);
  if(!slot) return;
  const b = slot.querySelector('[data-part="bubble"]');
  b.textContent = text;
  b.classList.add("show");
}
function hideBubbles(){
  stageEl.querySelectorAll('[data-part="bubble"]').forEach(b=>b.classList.remove("show"));
}

function resetPlaybackUI(){
  playIndex = 0;
  isPlaying = false;
  progressBar.style.width = "0%";
  falaAtualLabel.textContent = falas.length ? "Pronto para reproduzir." : "Nenhuma fala no roteiro ainda.";
  focusOn(null);
  hideBubbles();
}

function speak(text){
  return new Promise(resolve=>{
    if(!("speechSynthesis" in window) || !text){ resolve(); return; }
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = "pt-BR";
    currentUtterance = utter;
    utter.onend = resolve;
    utter.onerror = resolve;
    speechSynthesis.speak(utter);
  });
}

async function playFala(idx){
  const f = falas[idx];
  if(!f) return;
  const avatar = avatars.find(a=>a.id===f.avatarId);
  progressBar.style.width = `${Math.round(((idx)/falas.length)*100)}%`;
  falaAtualLabel.textContent = `Fala ${idx+1} de ${falas.length}${avatar ? " — " + avatar.name : ""}`;

  if(!avatar){ return; }

  focusOn(avatar.id);
  showBubble(avatar.id, f.texto || "(sem texto)");
  startGestureLoop(avatar.id, f.gesto);

  mouthTimer = setInterval(()=>{
    setMouth(avatar.id, Math.random() > 0.5);
  }, 140);

  await speak(f.texto);

  clearInterval(mouthTimer); mouthTimer = null;
  setMouth(avatar.id, false);
  stopGestureLoop();
  setArm(avatar.id, f.gesto, false);
  hideBubbles();
}

async function playFrom(idx){
  isPlaying = true;
  playIndex = idx;
  while(isPlaying && playIndex < falas.length){
    await playFala(playIndex);
    if(!isPlaying) break;
    playIndex++;
  }
  if(isPlaying){
    // fim do roteiro
    isPlaying = false;
    progressBar.style.width = "100%";
    falaAtualLabel.textContent = "Fim do roteiro.";
    focusOn(null);
  }
}

function stopPlayback(){
  isPlaying = false;
  if(mouthTimer){ clearInterval(mouthTimer); mouthTimer=null; }
  stopGestureLoop();
  speechSynthesis.cancel();
}

document.getElementById("btn-play").addEventListener("click", ()=>{
  if(falas.length===0){ toast("Adicione falas ao roteiro primeiro"); return; }
  if(isPlaying) return;
  playFrom(playIndex >= falas.length ? 0 : playIndex);
});
document.getElementById("btn-pause").addEventListener("click", ()=>{
  stopPlayback();
  falaAtualLabel.textContent = "Pausado.";
});
document.getElementById("btn-restart").addEventListener("click", ()=>{
  stopPlayback();
  resetPlaybackUI();
});
document.getElementById("btn-next").addEventListener("click", ()=>{
  const wasPlaying = isPlaying;
  stopPlayback();
  playIndex = Math.min(playIndex+1, falas.length);
  if(wasPlaying) playFrom(playIndex);
  else falaAtualLabel.textContent = `Pronto na fala ${Math.min(playIndex+1, falas.length)}.`;
});
document.getElementById("btn-prev").addEventListener("click", ()=>{
  const wasPlaying = isPlaying;
  stopPlayback();
  playIndex = Math.max(playIndex-1, 0);
  if(wasPlaying) playFrom(playIndex);
  else falaAtualLabel.textContent = `Pronto na fala ${playIndex+1}.`;
});

/* ---------------------------------------------------------------- */
/* Inicialização                                                      */
/* ---------------------------------------------------------------- */
resetForm();
renderAvatarList();
renderFalas();
showView(localStorage.getItem("roteiro_tab") || "avatares");

})();
</script>
</body>
</html>
